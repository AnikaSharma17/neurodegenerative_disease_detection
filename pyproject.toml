[project]
name = "neurodx"
version = "0.2.0"
description = "Multi-task CNNs for Alzheimer's staging and Parkinson's detection from MRI slices"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
